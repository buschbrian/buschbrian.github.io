<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A frozen snapshot of the Western Water Dashboard system atlas, as the system stood on 2026-08-23. An interactive diagram of the sources, the pipeline, the payloads, and the reader-facing surfaces.">
    <meta name="theme-color" content="#1e1d15">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://buschbrian.github.io/projects/western-water-dashboard-atlas/">
    <title>Western Water Dashboard Atlas</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
    <style>
    :root{
      --paper:#E6DFBE; --paper-2:#DCD4AF; --ink:#17170F; --ink-2:#6E6B54; --rule:#B9B293; --ghost:#8E8A70;
      --hi-bg:#17170F; --hi-fg:#E6DFBE; --face:#EFE9CC; --grid:#CFC8A3;
      --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
        --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
      }
    }
    :root[data-theme="dark"]{
      --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
      --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden}
    #app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh;min-height:600px}
    #top{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);overflow:hidden}
    .stat{padding:6px 14px 4px;border-right:1.5px solid var(--ink);min-width:0;white-space:nowrap}
    .stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
    .stat .v{font-size:15px;font-variant-numeric:tabular-nums}
    .stat.grow{flex:1;border-right:none;overflow:hidden}
    #controls{display:flex;gap:8px;align-items:center;padding:0 14px;border-left:1.5px solid var(--ink)}
    button.ctl{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
    button.ctl:hover{background:var(--face)}
    button.ctl:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
    button.ctl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    button.ctl.primary{background:var(--hi-bg);color:var(--hi-fg)}
    button.ctl.primary:hover{background:var(--hi-bg);opacity:.9}
    button.ctl:disabled{opacity:.4;cursor:default;box-shadow:none}
    #main{display:grid;grid-template-columns:232px 1fr 440px;min-height:0}
    #index{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 8px 20px}
    #index h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:12px 4px 6px;font-weight:500}
    #index h4:first-child{margin-top:2px}
    .ix{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;font-size:11.5px;line-height:1.3;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:7px 8px;margin:0 0 6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
    .ix .code{color:var(--ink-2);min-width:16px;font-size:10px;padding-top:1px}
    .ix .nm{flex:1}
    .ix .n{color:var(--ink-2);font-size:10.5px;font-variant-numeric:tabular-nums}
    .ix.ghost{border-style:dashed;box-shadow:none;color:var(--ink-2)}
    .ix.later{border-color:var(--rule);box-shadow:none;color:var(--ink-2);opacity:.75}
    .ix.later .n{font-size:9px;letter-spacing:.06em}
    .ix.new{outline:1.5px dashed var(--ink);outline-offset:2px}
    .ix.on{background:var(--hi-bg);color:var(--hi-fg)}
    .ix.on .code,.ix.on .n{color:var(--hi-fg);opacity:.75}
    .ix:hover:not(.on){background:var(--face)}
    .ix:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
    #canvasWrap{position:relative;min-width:0;background:var(--paper)}
    #svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
    #svg.dragging{cursor:grabbing}
    #zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
    #zoom button{width:30px;height:26px;font:inherit;font-size:14px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
    #rail{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
    #rail .ch{width:22px;height:22px;font:inherit;font-size:10px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;padding:0;line-height:1}
    #rail .ch.done{background:var(--face)}
    #rail .ch.on{background:var(--hi-bg);color:var(--hi-fg)}
    #rail .ch.locked{border-style:dashed;color:var(--ink-2)}
    #rail .ch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
    #rail .title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}
    #rail .title b{color:var(--ink);font-weight:500}
    #flowSel{position:absolute;left:12px;bottom:12px;display:none;gap:6px}
    #flowSel button{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);padding:3px 8px;cursor:pointer}
    #flowSel button.on{background:var(--hi-bg);color:var(--hi-fg)}
    #tip{position:absolute;pointer-events:none;background:var(--hi-bg);color:var(--hi-fg);font-size:11px;padding:4px 8px;max-width:280px;line-height:1.35;display:none;z-index:5}
    #panel{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
    #tabs{display:flex;border-bottom:1.5px solid var(--ink)}
    #tabs button{flex:1;font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:9px 6px;background:var(--paper);color:var(--ink);border:none;border-right:1.5px solid var(--ink);cursor:pointer}
    #tabs button:last-child{border-right:none}
    #tabs button.on{background:var(--hi-bg);color:var(--hi-fg)}
    #tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
    #body{overflow-y:auto;padding:14px 18px 40px;flex:1}
    .eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
    h1.t{font-size:22px;font-weight:500;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
    .lede{font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:56ch}
    .sub{color:var(--ink-2);font-size:11px;margin-bottom:14px}
    h3.sec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:20px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
    #body p{margin:0 0 12px;max-width:62ch}
    #body ul{margin:0 0 12px;padding-left:18px;max-width:62ch}
    #body li{margin-bottom:6px}
    mark{background:var(--hi-bg);color:var(--hi-fg);padding:0 3px}
    .chip{display:inline-block;border:1.5px solid var(--ink);padding:1px 6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 6px 0;background:var(--paper);color:var(--ink);font-family:inherit;cursor:pointer}
    .chip.ghost{border-style:dashed;color:var(--ink-2)}
    .chip.static{cursor:default}
    pre{background:var(--face);border:1.5px solid var(--rule);padding:10px 12px;font-size:11px;line-height:1.45;overflow-x:auto;margin:0 0 12px;white-space:pre}
    .step{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:0 0 8px;font-size:12px}
    .step .no{color:var(--ink-2);font-variant-numeric:tabular-nums}
    .step.cur .no{color:var(--ink);font-weight:600}
    .step.cur .tx{background:var(--face);outline:1.5px solid var(--ink);padding:2px 6px}
    .actions{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
    .pk{border:1.5px solid var(--ink);padding:10px 12px;margin:0 0 12px}
    .pk .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
    .pk .route{font-size:12px;margin:2px 0 8px}
    details{border-top:1.5px solid var(--rule);margin:8px 0 0;padding:6px 0 0}
    details summary{cursor:pointer;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
    details summary::before{content:'+';display:inline-block;width:12px;color:var(--ink)}
    details[open] summary::before{content:'−'}
    details summary::-webkit-details-marker{display:none}
    details > *:not(summary){margin-top:8px}
    #hint{border-top:1.5px solid var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;padding:0 14px;gap:14px;overflow:hidden;white-space:nowrap}
    .q{padding-left:0;list-style:none}
    .q li{position:relative;padding-left:18px}
    .q li::before{content:'?';position:absolute;left:0;top:0;color:var(--ink-2)}
    .q li.res::before{content:'✓'}
    .q li.to::before{content:'→'}
    .q li.res>span,.q li.to>span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
    .q li.to>span{text-decoration:none}
    .q .ans{margin-top:2px;padding-left:10px;border-left:1.5px solid var(--ink)}
    @keyframes halo{0%{opacity:.9}50%{opacity:.25}100%{opacity:.9}}
    .halo{animation:halo 1.6s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){.halo{animation:none}}
    @media (max-width:1100px){#main{grid-template-columns:200px 1fr 360px}}
    </style>
    <style>

    #stats { display: flex; min-width: 0; flex: 1; }
    .snapshot-note {
      position: fixed; right: 10px; bottom: 26px; z-index: 40;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      justify-content: flex-end; max-width: min(92vw, 640px);
      padding: 7px 10px; border: 1px solid var(--rule);
      background: var(--paper); color: var(--ink-2);
      font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
      text-transform: uppercase;
    }
    .snapshot-note b { color: var(--ink); font-weight: 600; }
    .snapshot-note a { color: var(--ink); text-underline-offset: 3px; }
    .snapshot-note a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    @media (max-width: 720px) { .snapshot-note { display: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="top">
        <div id="stats"></div>
        <div id="controls">
          <button type="button" class="ctl" id="btnBack">◂ Back</button>
          <button type="button" class="ctl primary" id="btnNext">Next ▸</button>
          <button type="button" class="ctl" id="btnFlow">‖ Pause</button>
          <button type="button" class="ctl" id="btnStep">Trace one step</button>
          <button type="button" class="ctl" id="btnReset">Refit</button>
          <button type="button" class="ctl" id="btnTheme">Light theme</button>
        </div>
      </div>
      <div id="main">
        <nav id="index" aria-label="Structures"></nav>
        <div id="canvasWrap">
          <svg id="svg" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.1"/></pattern>
              <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width=".8" opacity=".55"/></pattern>
            </defs>
            <g id="world"></g>
          </svg>
          <div id="rail"></div>
          <div id="flowSel"></div>
          <div id="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button></div>
          <div id="tip"></div>
        </div>
        <aside id="panel" aria-label="Chapter detail">
          <div id="tabs">
            <button type="button" data-tab="what" class="on">What it does</button>
            <button type="button" data-tab="how">How it's built</button>
            <button type="button" data-tab="cond">Open questions</button>
          </div>
          <div id="body"></div>
        </aside>
      </div>
      <div id="hint">
        <span>enter / ] next chapter</span><span>[ back</span><span>hover to read</span><span>click to pin</span><span>→ go inside</span><span>← come out</span><span>click a dot to inspect its packet</span>
      </div>
    </div>

    <script>
    const GROUPS = [{"id":"reader","title":"Reader and navigation"},{"id":"front","title":"Typed browser runtime"},{"id":"reservoir","title":"Reservoir data path"},{"id":"snow","title":"Snow data path"},{"id":"drought","title":"Drought data path"},{"id":"reference","title":"Reference and geography data"},{"id":"delivery","title":"Refresh, build, and publication"},{"id":"assurance","title":"Contracts and verification"}];
    const NODES = [{"id":"R","code":"R","name":"Reader","short":"READER","group":"reader","gx":0,"gy":18,"w":2,"d":2,"h":40,"kind":"screen","one":"A person opens a dashboard page, changes a place or filter, and shares the resulting URL.","what":"The reader is the start and end of every browser flow. A visit can begin with an explicit link, a remembered place, or the all-area default.","how":"Browser input reaches static HTML pages on GitHub Pages. Keyboard, pointer, responsive, and assistive-technology behavior are checked at 1280, 390, and 360 pixels.","steps":[["Open","Request a current page or a retired bookmark."],["Choose","Set place, level, subject filters, table state, or a selected reservoir."],["Read","Receive maps, charts, tables, exact values, provenance, and failure states."],["Share","Copy URL state that describes the visible view, never a hidden preference."]],"cond":[]},{"id":"PG","code":"PG","name":"Current pages","short":"PAGES","group":"reader","gx":4,"gy":16,"w":3,"d":3,"h":42,"kind":"screen","one":"Eight static shells expose storage, charts, one-reservoir detail, snow, drought, methods, data, and terms.","what":"Each page is a stable URL with its own subject and shareable state. Modern and index are the same storage application, and every published reservoir resolves through one permanent detail shell.","how":"<code>index.html</code>, <code>overview.html</code>, <code>reservoir.html</code>, <code>snow.html</code>, <code>drought.html</code>, <code>methods.html</code>, <code>data.html</code>, and <code>terms.html</code> load page-specific TypeScript entry points.","steps":[["Shell","HTML provides slots, landmarks, initial busy state, and module entry."],["Hydrate","The entry point reads state, loads data, and fills the shell."],["Report","A page-specific readiness object exposes independent facts to browser tests."]],"cond":[]},{"id":"UR","code":"UR","name":"URL and remembered place","short":"URL STATE","group":"reader","gx":2,"gy":22,"w":3,"d":3,"h":24,"kind":"store","one":"The address bar wins over a remembered place, and both win over the everywhere default.","what":"The complete visible view is shareable. A stored preference helps an ordinary return visit but never leaks into a copied link or interrupts any non-empty query string.","how":"<code>src/state/*-url.ts</code>, <code>opening-preference.ts</code>, <code>portable-url.ts</code>, and <code>ui/opening-splash.ts</code> parse, narrow, repair, persist, and move portable place state between surfaces.","steps":[["Resolve","Read explicit query state, then storage, then default."],["Narrow","Apply state, county, drainage, hydrologic level, dominant reservoirs, and surface-owned filters."],["Write","Use replaceState for in-page changes and location.replace when the selected level changes fetched files."],["Remember","Persist only an intentional place choice and clear it if that surface has no measurement there."]],"cond":[]},{"id":"RR","code":"RR","name":"Retired route redirects","short":"REDIRECTS","group":"reader","gx":0,"gy":13,"w":2,"d":2,"h":28,"kind":"gate","one":"Old ArcGIS, MapLibre, explore, and overview bookmarks are translated into current URLs.","what":"Compatibility preserves what a saved link meant without running or shipping the retired applications.","how":"<code>legacy/</code>, <code>maplibre/</code>, and <code>explore.html</code> load <code>public/retired-route.js</code>, which allows known parameters, translates them, and redirects to a current page.","steps":[["Read","Accept a retired path and its old query string."],["Allow","Keep only recognized state and selection fields."],["Translate","Map old names and parameter shapes to the current contract."],["Replace","Navigate without leaving a retired runtime in history."]],"cond":[]},{"id":"EP","code":"EP","name":"Page entry points","short":"ENTRYPOINTS","group":"front","gx":8,"gy":16,"w":3,"d":3,"h":48,"kind":"box","one":"Large TypeScript entry modules sequence one page while delegating behavior to testable owners.","what":"The entry points are wiring: they choose the load order, connect controls, handle unhappy paths, and publish readiness; they are not the home of reusable business rules.","how":"<code>src/main.ts</code>, <code>overview.ts</code>, <code>reservoir.ts</code>, <code>snow.ts</code>, <code>drought.ts</code>, <code>methods.ts</code>, and <code>data-docs.ts</code> compose modules under <code>data/</code>, <code>state/</code>, <code>ui/</code>, and <code>viz/</code>.","steps":[["Read state","Resolve URL and opening place before first analytical paint."],["Load","Start required requests in parallel and optional context after the subject can render."],["Compose","Connect models, controls, charts, map controllers, tables, and downloads."],["Finish","Clear busy states and publish independent readiness fields on success or failure."]],"cond":[]},{"id":"LD","code":"LD","name":"Runtime loaders and validators","short":"LOAD + CHECK","group":"front","gx":9,"gy":21,"w":3,"d":3,"h":36,"kind":"gate","one":"Every runtime file crosses a deadline, HTTP status check, schema guard, and semantic validator before use.","what":"A page never trusts JSON because it exists. A malformed version, impossible shape, wrong level, or hanging request becomes an explicit failure state rather than a confident wrong map.","how":"<code>src/data/fetch.ts</code> uses <code>AbortSignal.timeout</code> and <code>cache: no-cache</code>. Specialized loaders feed <code>validate.ts</code>, <code>snow-validate.ts</code>, <code>drought-validate.ts</code>, and lighter inventory or polygon parsers.","steps":[["Request","Fetch the development root path or published data path."],["Deadline","Cancel after 15 seconds, or 30 seconds for large snow and drought geometry."],["Parse","Decode JSON only after a successful HTTP status."],["Validate","Refuse incompatible schema, units, dates, duplicates, levels, or cross-field contradictions."],["Return","Hand typed payloads to the entry point."]],"cond":[]},{"id":"MD","code":"MD","name":"State and pure models","short":"MODELS","group":"front","gx":13,"gy":16,"w":3,"d":3,"h":40,"kind":"box","one":"Pure functions turn validated records and selected state into scoped rows, rollups, chart points, and detail language.","what":"One calculation feeds every rendering of the same fact, so a map, table, summary, download, and tooltip cannot quietly answer different questions.","how":"<code>src/state/</code> owns filters, URL state, selection, detail text, baselines, tables, and ranking. Page models include <code>overview-model.ts</code>, <code>reservoir-model.ts</code>, <code>snow-model.ts</code>, <code>drought-model.ts</code>, and <code>weekly-model.ts</code>; <code>data/rollup.ts</code> owns scoped totals.","steps":[["Scope","Apply place, level, reporting, class, and dominant-reservoir choices once."],["Derive","Compute weighted storage, seasonal comparisons, rankings, curves, and cross-subject rows."],["Describe","Build consistent labels and explanatory text from shared helpers."],["Return","Provide immutable view data to UI and visualization modules."]],"cond":[]},{"id":"UI","code":"UI","name":"Calcite UI and charts","short":"UI + CHARTS","group":"front","gx":17,"gy":16,"w":3,"d":3,"h":38,"kind":"screen","one":"Shared controls, tables, templates, legends, and charts render model answers and feed state changes back to the page.","what":"The interface separates place from presentation, keeps exact values reachable, supports phone layouts, and makes loading and failure states visible.","how":"<code>src/ui/</code> owns shells, headers, place and level controls, tables, details, legends, and mobile disclosure. <code>src/viz/</code> owns storage, snow, drought, trend, responsive SVG, formatting, and ArcGIS Charts adapters. <code>src/styles/</code> carries the solved layout constraints.","steps":[["Render","Create controls and semantic output from model data."],["Observe","Listen to Calcite, keyboard, pointer, and resize events."],["Write state","Send an intentional change through the page-owned URL writer."],["Redraw","Update all dependent summaries, charts, rows, selection, and downloads together."]],"cond":[]},{"id":"MP","code":"MP","name":"ArcGIS map controllers","short":"MAPS","group":"front","gx":21,"gy":15,"w":3,"d":3,"h":34,"kind":"screen","one":"Map controllers translate typed view data into reservoir points, snow areas and sites, drought polygons, and reference layers.","what":"Storage and snow protect discrete marks by sinking reference lines; drought may draw boundaries over a continuous tiled surface. Basemap and hosted-layer failure leave the stored measurements available.","how":"<code>src/ui/map.ts</code>, <code>snow-map.ts</code>, <code>drought-map.ts</code>, <code>layers.ts</code>, and <code>view-map.ts</code> compose <code>src/arcgis/</code> basemap, authentication, fallback, reference, hillshade, and watershed-layer policies.","steps":[["Create view","Install anonymous policy before ArcGIS resources are requested."],["Draw subject","Build client graphics or a renderer keyed to committed codes and values."],["Add context","Join the published roster to hosted outlines and optional references."],["Sink or raise","Order reference layers according to whether lines can hide the subject."],["Report","Expose separate readiness for view, basemap, subject marks, and reference context."]],"cond":[]},{"id":"ES","code":"ES","name":"Public ArcGIS services","short":"HOSTED MAPS","group":"front","gx":25,"gy":12,"w":4,"d":3,"h":18,"kind":"slab","one":"Public Esri and USGS services provide basemaps, watershed shapes, labels, counties, and optional map context.","what":"The browser asks hosted services for geometry and cartographic context, not for the dashboard measurements. Public pages never require an API key.","how":"<code>src/arcgis/watershed-layers.ts</code> selects National Map HUC-2 or Living Atlas HUC-4/6/8 layers. Other modules use public basemaps, World Hillshade where allowed, Census counties, and reference layers with explicit timeouts and fallbacks.","steps":[["Select layer","Choose the publisher and code field from the payload-declared level."],["Query","Request quantized shapes or optional context for the current view."],["Render","Join shapes to committed codes and style them from current typed values."],["Degrade","Keep data, charts, and tables when an optional service does not answer."]],"cond":[]},{"id":"RF","code":"RF","name":"Reference payload","short":"REFERENCE JSON","group":"reference","gx":13,"gy":22,"w":3,"d":3,"h":24,"kind":"store","one":"reference.json publishes drainage rosters, offered levels, boxes, names, states, and reviewed capacity evidence without polygons.","what":"This compact runtime contract tells every map what geography exists and what it is called. Hosted services carry shapes; the committed payload carries the roster that measurements were assigned against.","how":"<code>tools/build_reference_export.py</code> serializes <code>refresh_reservoirs.build_export_sections()</code> from capacities and registered watershed files. <code>src/data/boundaries.ts</code> fetches it once per URL and shares the in-flight request.","steps":[["Fetch","Load one schema-versioned file at runtime."],["Resolve level","Select a named drawn scope from shared or drought offers."],["Parse roster","Keep valid codes, names, state reach, and optional boxes; drop malformed entries independently."],["Serve controls","Build offered-level and opening-place choices from published facts."]],"cond":[]},{"id":"AR","code":"AR","name":"Reviewed admission records","short":"ROSTERS","group":"reservoir","gx":10,"gy":28,"w":3,"d":3,"h":24,"kind":"store","one":"Hand-reviewed rosters decide which reservoir stations may publish and which capacity evidence each may use.","what":"Automatic discovery can propose a candidate, but publication requires committed evidence. Withheld California and Colorado entries keep the exact finding that prevents admission.","how":"<code>admitted_reservoirs.json</code>, <code>admitted_rise_reservoirs.json</code>, <code>admitted_cdec_reservoirs.json</code>, <code>admitted_cdss_reservoirs.json</code>, and <code>admitted_usgs_reservoirs.json</code> are loaded by <code>pipeline/roster.py</code> and screened by <code>admission.py</code>.","steps":[["Discover","Audit provider catalogs inside the registered roster geography."],["Screen","Check storage meaning, recent reporting, location, denominator evidence, and source agreement."],["Review","Record an admission or a withheld finding by provider station identity."],["Load","Refuse duplicate identities, missing evidence, or an unexplained waiver."]],"cond":[]},{"id":"PA","code":"PA","name":"Reservoir provider adapters","short":"ADAPTERS","group":"reservoir","gx":16,"gy":28,"w":3,"d":3,"h":28,"kind":"cards","one":"One adapter per provider turns distinct APIs, dates, cadences, units, and pagination into a common storage series.","what":"The rest of the pipeline sees date and acre-feet rows. Provider-specific schema changes, missing values, monthly calendar conventions, and retries stay isolated here.","how":"<code>pipeline/providers.py</code> implements RISE, NRCS AWDB, California CDEC, Colorado CDSS, and USGS daily-value adapters with bounded retries. Tests replace transport helpers and never touch the network.","steps":[["Request","Call a provider with station identity, history start, and end date."],["Page or batch","Follow provider-specific result shapes and limits."],["Normalize","Return a sorted DataFrame with date and storage_af."],["Correct calendar","Move CDEC monthly stamps to the end of the month they describe without changing readings."],["Fail locally","Return or raise enough context to carry one previous station without hiding the fault."]],"cond":[]},{"id":"OP","code":"OP","name":"Official storage APIs","short":"SOURCE APIS","group":"reservoir","gx":23,"gy":29,"w":4,"d":3,"h":18,"kind":"slab","one":"Five official systems supply reservoir observations: Reclamation, NRCS, California, Colorado, and USGS.","what":"These services are the measurement sources. They differ in identity, frequency, record length, availability, and what they mean by a storage field.","how":"The adapters call the Bureau of Reclamation RISE API, USDA NRCS AWDB, California Data Exchange Center, Colorado Division of Water Resources API, and USGS National Water Information System daily values.","steps":[["Publish","Expose provisional or operational storage series."],["Answer","Return daily or monthly readings for a reviewed station."],["Revise","Allow historical observations to change upstream; the next full refresh recomputes the record."]],"cond":[]},{"id":"RC","code":"RC","name":"Reservoir refresh and methods","short":"RESERVOIR JOB","group":"reservoir","gx":17,"gy":23,"w":3,"d":3,"h":34,"kind":"job","one":"The reservoir orchestrator fetches every admitted station, computes published metrics, applies freshness policy, validates breadth, and assembles one payload.","what":"A failed station can carry forward with an explicit reason. A broad provider failure cannot overwrite the previous file. A record older than the withdrawal threshold leaves current totals but remains named in a notice.","how":"<code>refresh_reservoirs.py</code> sequences <code>pipeline/constants.py</code>, <code>roster.py</code>, <code>providers.py</code>, <code>seasonal.py</code>, <code>history.py</code>, <code>freshness.py</code>, <code>numbers.py</code>, and <code>geography.py</code>.","steps":[["Load evidence","Read prior payload, reviewed capacities, roster, and 1991–2020 normals."],["Fetch","Run each provider adapter for its admitted station set."],["Summarize","Compute current storage, percent full, two baselines, annual votes, rank, changes, peak, and monthly history."],["Protect","Carry individual failures, refuse a run with fewer than half of attempted stations fresh, and partition observations older than 60 days."],["Assemble","Attach geography, sort by physical capacity, add source, method, coverage, freshness, and withdrawal metadata."],["Signal","Write late and withdrawn counts and tables for the workflow."]],"cond":[]},{"id":"GE","code":"GE","name":"Reservoir geography assignment","short":"GEOGRAPHY","group":"reservoir","gx":22,"gy":22,"w":3,"d":3,"h":30,"kind":"box","one":"Finished reservoir records receive two separate locations: administrative county from the waterbody and drainage area from the dam or outlet.","what":"The distinction prevents Lake Powell and similar reservoirs from pretending the place where water sits and the place where water leaves are the same fact.","how":"<code>pipeline/geography.py</code> reads <code>counties.json</code> by station and calls <code>huc.location_fields</code> against the boundary named by <code>watershed_scopes.DEFAULT_SCOPE</code>. <code>capacities.json</code> supplies reviewed dam points when available.","steps":[["Attach stable location","Set in-state and cross-border waterbody facts from the published point and reviewed exceptions."],["Assign drainage","Place the dam or outlet inside a committed HUC boundary with a minimum margin."],["Attach county","Look up the committed five-digit FIPS assignment for the waterbody point."],["Summarize","Publish assigned and unassigned counts plus names and grouping rosters."]],"cond":[]},{"id":"RJ","code":"RJ","name":"Reservoir runtime payload","short":"RESERVOIRS","group":"reservoir","gx":26,"gy":22,"w":3,"d":3,"h":24,"kind":"store","one":"reservoirs.json is the daily source for every storage surface and its morning commit is the deploy trigger.","what":"The file contains 382 current reservoir records on 2026-08-23, their measurements, comparison evidence, source identity, location, freshness, history, and any withdrawal notices.","how":"<code>refresh_reservoirs.py</code> writes schema and method versions plus <code>reservoirs</code>. Vite copies the same bytes to root, <code>data/reservoirs.json</code>, and <code>api/reservoirs.json</code>; the browser loads the data path and public users may use the API alias.","steps":[["Write","Replace the generated file only after a sufficiently broad verified run."],["Commit","Stage it from the manifest with all other changed daily files."],["Copy","Place identical bytes in the published runtime paths during the Vite build."],["Fetch","Validate at runtime before any storage model uses it."]],"cond":[]},{"id":"SA","code":"SA","name":"NRCS snow data service","short":"SNOW API","group":"snow","gx":28,"gy":30,"w":4,"d":3,"h":18,"kind":"slab","one":"The NRCS AWDB REST service supplies daily snow-water equivalent and 1991–2020 medians for the reviewed station inventory.","what":"One response can cover many stations, and a quiet station is common enough that the pipeline distinguishes a small named gap from a broad service failure.","how":"<code>refresh_snowpack.py</code> requests element WTEQ, daily duration, medians, and quality flags in batches of 75 with three attempts and a 120-second request deadline.","steps":[["Batch","Receive reviewed station triplets and a water-year date range."],["Return","Provide daily values, medians, timing tendencies, and flags."],["Retry","Allow a short batch to be retried one station at a time."]],"cond":[]},{"id":"SP","code":"SP","name":"Snowpack refresh","short":"SNOW JOB","group":"snow","gx":24,"gy":27,"w":3,"d":3,"h":34,"kind":"job","one":"The snow job fetches the reviewed network, normalizes site series, computes area rollups, compacts the shared calendar, and writes atomically.","what":"The job tolerates only a small percentage of missing stations, names every absence, and refuses a broad short response. Basin percentages use summed water over summed medians once.","how":"<code>refresh_snowpack.py</code> reads <code>snow_sites.json</code>, calls AWDB, validates units and series, uses <code>huc.py</code> for coarser names, and writes through a temporary file and atomic replace.","steps":[["Load inventory","Read reviewed station identity, coordinates, county name, elevation, HUC-6, and normal period."],["Fetch all","Batch requests, recover short batches station by station, and enforce the missing-site tolerance."],["Normalize","Build site series, latest date, lateness, normal timing, and per-site percentage."],["Roll up","Group by basin and date; divide summed water by summed medians when enough sites report."],["Compact","Publish the water-year date array once and store per-site positions and values."],["Write","Atomically replace snowpack.json only after full payload validation."]],"cond":[]},{"id":"SJ","code":"SJ","name":"Snow runtime payloads","short":"SNOW FILES","group":"snow","gx":30,"gy":25,"w":3,"d":3,"h":24,"kind":"store","one":"snowpack.json carries daily measurements and rollups, while snow_sites.json carries the stable reviewed station inventory.","what":"The browser gets large seasonal series only on Snowpack. Drought can fetch the smaller inventory to draw optional snow-site context without downloading every daily reading.","how":"<code>snowpack.json</code> held 637 reporting sites and 51 basin rollups on 2026-08-23. <code>tools/build_snotel_inventory.py</code> rebuilds <code>snow_sites.json</code> on demand; <code>refresh_snowpack.py</code> rewrites only <code>snowpack.json</code> daily. Vite copies both to root and data paths and publishes an API alias for snowpack.","steps":[["Inventory","Provide stable names, points, counties, elevations, and basin assignments."],["Measurements","Provide method metadata, shared calendar, compact site arrays, and drainage rollups."],["Load","Use the large payload for snow analysis or the small inventory for optional drought context."]],"cond":[]},{"id":"DM","code":"DM","name":"U.S. Drought Monitor layer","short":"USDM SOURCE","group":"drought","gx":34,"gy":28,"w":4,"d":3,"h":18,"kind":"slab","one":"A public ArcGIS feature layer supplies one current polygon feature for each drought intensity.","what":"The source publishes weekly conditions. The dashboard downloads and verifies one coherent national set before it computes any drainage-area shares.","how":"<code>tools/fetch_drought_monitor.py</code> checks layer metadata, object ID field, GeoJSON support, required dates and fields, then downloads every object ID in bounded batches at about 100-metre geometry tolerance.","steps":[["Describe","Read live layer metadata and its record limit."],["List","Request every object ID."],["Fetch","Download every batch as WGS 84 GeoJSON."],["Verify","Require one feature per intensity, no duplicate or missing ID, polygon geometry, and one common map and release date."]],"cond":[]},{"id":"DC","code":"DC","name":"Drought download and coverage","short":"DROUGHT JOB","group":"drought","gx":35,"gy":23,"w":3,"d":3,"h":34,"kind":"job","one":"The drought tools download verified polygons, measure land shares at every offered level, carry one previous week, and guard the set as one date.","what":"Coverage is deterministic from committed polygons, watershed boundaries, and a U.S. land mask. Outside-mask cells are not measured, never relabeled as no drought.","how":"<code>tools/compute_drought_coverage.py</code> uses even-odd scanline sampling at 0.002 degrees with cosine latitude weighting. It runs for HUC-2, HUC-4, HUC-6, and drought-only HUC-8. <code>check_drought_pair.py</code> refuses mixed weeks.","steps":[["Download","Atomically replace the current polygon file only after live-schema and completeness checks."],["Load inputs","Read the selected registered boundary file, the current polygons, and data/us-land.geojson."],["Measure","Sample cell centres, keep measured land, compute exclusive and cumulative shares, and report coverage of the whole unit separately."],["Compare","Embed the newest strictly older week from that level archive."],["Archive","Merge the week for levels 2, 4, and 6; keep HUC-8 current-only."],["Pair check","Verify every coverage file and the polygon file name the same week or restore the last committed set."]],"cond":[]},{"id":"DJ","code":"DJ","name":"Drought runtime payloads","short":"DROUGHT FILES","group":"drought","gx":32,"gy":20,"w":3,"d":3,"h":24,"kind":"store","one":"One verified polygon file and four coverage files drive the drought map, summaries, rankings, changes, and storage comparisons.","what":"Changing level fetches another file but never another week. HUC-2, HUC-4, and HUC-6 each keep an archive; HUC-8 starts without history.","how":"<code>data/drought/usdm-current.geojson</code>, <code>usdm-huc2.json</code>, <code>usdm-huc4.json</code>, <code>usdm-huc6.json</code>, and <code>usdm-huc8.json</code> are copied verbatim into <code>dist/data/drought/</code>. On 2026-08-23 the current map date was 2026-08-18 and HUC-6 carried 75 units.","steps":[["Publish geometry","Draw exclusive drought classes from the committed weekly polygons."],["Publish shares","Join level-specific unit codes to measured percentages and condition."],["Publish change","Use the embedded previous block for one week-over-week subtraction."],["Validate together","Require map date, level, method, units, measured denominator, and previous-week order to agree."]],"cond":[]},{"id":"XS","code":"XS","name":"Authoritative reference services","short":"REF SERVICES","group":"reference","gx":39,"gy":28,"w":4,"d":3,"h":18,"kind":"slab","one":"Long-lived evidence comes from national dams, watersheds, counties, hydrography, upstream networks, land boundaries, and provider catalogs.","what":"These services do not sit on the critical daily browser path. Builders fetch them deliberately, review or merge the result, stamp retrieval dates, and commit the derived evidence.","how":"Sources include the National Inventory of Dams, USGS Watershed Boundary Dataset, Census counties, NHD/NLDI, U.S. land boundaries, NRCS station inventory, and source-specific reservoir catalogs.","steps":[["Query","Run a focused builder or non-writing probe with a deadline."],["Check","Validate source schema, completeness, identity, units, location, and evidence."],["Return","Provide candidate or derived facts for review and merge."]],"cond":[]},{"id":"BT","code":"BT","name":"Builders, audits, and probes","short":"TOOLS","group":"reference","gx":39,"gy":22,"w":3,"d":3,"h":30,"kind":"cards","one":"The tools directory separates non-writing investigation from merge-safe builders that own committed reference files.","what":"Audits and probes explain what could change. Builders make an explicit, reproducible change to one classified file and never silently drop records outside a partial run.","how":"<code>tools/audit_*</code>, <code>probe_*</code>, <code>check_*</code>, and <code>measure_*</code> print only. <code>build_*</code>, <code>fetch_*</code>, and the drought computation own paths declared in <code>data/generated-files.json</code>.","steps":[["Probe","Measure a source, candidate, method, boundary, or discrepancy without writing repository data."],["Review","Turn evidence into an admission, decision, or scoped rebuild command."],["Build","Fetch or derive a named file, merging with committed records when the run is partial."],["Stamp","Record retrieval and method metadata inside long-lived data."],["Check drift","Compare generated output with its declared inputs in tests or explicit check mode."]],"cond":[]},{"id":"RA","code":"RA","name":"Long-lived reference assets","short":"REF ASSETS","group":"reference","gx":35,"gy":17,"w":4,"d":3,"h":24,"kind":"store","one":"Committed capacity, county, normal, watershed, land, upstream, and station files make daily calculations reproducible.","what":"A daily run uses reviewed facts from version control instead of letting a remote service move geography, capacity, or a comparison baseline under the same code.","how":"Assets include <code>capacities.json</code>, <code>counties.json</code>, <code>normals.json</code>, <code>upstream_index.json</code>, <code>snow_sites.json</code>, <code>data/watersheds/*.geojson</code>, and <code>data/us-land.geojson</code>. Frozen <code>huc6.geojson</code> and <code>utah-boundary.geojson</code> remain for compatibility and classification.","steps":[["Own","data/generated-files.json names each class, writer, and daily staging rule."],["Merge","On-demand rebuilds preserve records not selected or temporarily absent."],["Consume","Reservoir, snow, drought, reference export, browser detail, and tests read the exact committed version."],["Review age","A reporting tool names reference files due for review without making calendar time fail CI."]],"cond":[]},{"id":"WF","code":"WF","name":"Scheduled refresh workflow","short":"GITHUB JOB","group":"delivery","gx":17,"gy":7,"w":3,"d":3,"h":32,"kind":"job","one":"GitHub Actions starts the morning refresh, grants only content and issue writes, and handles GitHub-specific issue operations.","what":"The workflow decides when the run starts and what GitHub permissions it has. The repository script owns the actual refresh sequence so local and hosted runs stay the same.","how":"<code>.github/workflows/refresh-data.yml</code> runs daily at 12:00 UTC and on demand with non-cancelling concurrency, Python 3.11, locked pipeline dependencies, <code>scripts/refresh-daily.sh</code>, and issue maintenance through <code>gh</code>.","steps":[["Trigger","Start on schedule or manual dispatch with one refresh per branch."],["Prepare","Check out main and install requirements-pipeline.txt."],["Delegate","Run the same daily script used locally."],["Read signals","Consume drought age plus late and withdrawn outputs."],["Maintain issues","Open, update, or close the three self-healing issue states."]],"cond":[]},{"id":"OR","code":"OR","name":"Daily refresh orchestrator","short":"DAILY SCRIPT","group":"delivery","gx":22,"gy":7,"w":3,"d":3,"h":34,"kind":"job","one":"One shell script runs reservoir, drought, and snow stages independently, verifies their contracts, stages the manifest-owned set, commits, and pushes.","what":"A bad morning retains previous verified data. Reservoir failure stops the run; drought or snow failure keeps that subject old without deleting the successful subjects.","how":"<code>scripts/refresh-daily.sh</code> reads <code>data/generated-files.json</code> for staged paths, runs reservoir retries with 1/3/9-minute backoff, downloads and computes drought, runs the pair check, refreshes snow, then commits and rebases a rejected push up to three times.","steps":[["Reservoirs","Run refresh_reservoirs.py with whole-run retry and stop if every attempt fails."],["Drought","Fetch polygons, compute four levels, revert the polygon on coverage failure, and restore the complete drought set on pair mismatch."],["Snow","Run refresh_snowpack.py and keep the prior complete file on failure."],["Stage","Read staged_by_refresh paths from the generated-file manifest."],["Commit","Create one daily data commit if bytes changed."],["Push","Push, or rebase and retry a non-fast-forward race."]],"cond":[]},{"id":"IS","code":"IS","name":"Self-healing feed issues","short":"FEED ISSUES","group":"delivery","gx":27,"gy":7,"w":3,"d":3,"h":28,"kind":"gate","one":"Late drought, late reservoir feeds, and withdrawn reservoir feeds each maintain one GitHub issue that closes itself on recovery.","what":"Operational degradation stays visible without failing a safe data refresh or requiring a person to remember to close a resolved alert.","how":"<code>tools/feed_issue_report.py</code> builds deterministic titles and bodies; <code>scripts/gh-selfhealing-issue.sh</code> finds the labeled issue and opens, updates, or closes it; the workflow supplies current counts and dates through environment variables.","steps":[["Detect","Read drought age or reservoir CI outputs."],["Describe","Generate a stable issue body and title from typed command arguments."],["Upsert","Open or update the one issue for that condition."],["Heal","Close it automatically when the next run reports recovery."]],"cond":[]},{"id":"CM","code":"CM","name":"Data commit on main","short":"DATA COMMIT","group":"delivery","gx":22,"gy":2,"w":3,"d":3,"h":24,"kind":"store","one":"A verified change to the manifest-owned runtime files is committed to main as one deployable data revision.","what":"Version control is both the review trail and the handoff between data production and static-site publication. Yesterday remains recoverable when today fails.","how":"The daily script configures the GitHub Actions bot, stages only <code>staged_by_refresh</code> paths, commits with a fixed message, and pushes. A successful refresh workflow later triggers the Pages workflow explicitly because token-authored pushes do not recurse.","steps":[["Stage exact set","Use the manifest rather than a workflow copy."],["Skip no-op","Exit when the index has no changed generated bytes."],["Commit","Write one coherent data revision."],["Trigger release","Finish the successful refresh workflow so workflow_run can start deployment."]],"cond":[]},{"id":"VG","code":"VG","name":"Verification gates","short":"VERIFY","group":"assurance","gx":15,"gy":2,"w":3,"d":3,"h":30,"kind":"gate","one":"Type, unit, pipeline, build, browser, accessibility, compatibility, and publication checks enforce the repository contracts.","what":"The smallest local target supports iteration; CI runs the same entry points. Browser checks serve dist, cross shadow roots, watch console and font hosts, and inspect responsive layouts.","how":"<code>npm run verify:fast</code>, <code>verify:frontend</code>, <code>verify:pipeline</code>, <code>verify:browser</code>, and <code>verify:all</code> route to TypeScript, Vitest, pytest, SDK budget, Vite, Playwright, axe-core, and repository scripts. CI splits them into diagnosable jobs.","steps":[["Static","Typecheck and run pure frontend unit tests."],["Pipeline","Run Python data, geography, source, generated-file, and measurement tests without network."],["Build","Enforce SDK budget and compile every current and compatibility page."],["Browser     const HOW_HTML = "<div class=\"eyebrow\">Western Water Dashboard · checked 2026-08-23</div><h1 class=\"t\">How the repository is built</h1><div class=\"sub\">typed browser runtime · reproducible data pipelines · static publication</div><h3 class=\"sec\">Three execution planes</h3><p><mark>Browser:</mark> page entrypoints fetch validated runtime files, derive one scoped answer, and render UI, charts, tables, and maps.</p><p><mark>Data:</mark> reservoir, snow, drought, and reference builders read reviewed evidence and authoritative services, then write classified committed files.</p><p><mark>Delivery:</mark> the daily script commits safe changes; verification and Vite produce dist; GitHub Pages publishes it.</p><h3 class=\"sec\">Source ownership</h3><pre>src/                 runtime code\npipeline/            reservoir concerns\ntools/               probes and builders\ndata/ + root JSON    committed contracts\nscripts/ + workflows orchestration\ntests/               executable invariants\ndocs/                current truth and decisions</pre><h3 class=\"sec\">Load-bearing rule</h3><p>Runtime measurements are <mark>copied, never bundled</mark>. A morning data-only commit can deploy without changing application code, and every page revalidates the committed bytes before using them.</p>";

        h.path.scr.slice(1,-1).forEach(p=>hg.appendChild(el('polygon',{points:pts([[p[0],p[1]-3.5],[p[0]+3.5,p[1]],[p[0],p[1]+3.5],[p[0]-3.5,p[1]]]),fill:'var(--ink)'})));
      });
      const ng=el('g'); world.appendChild(ng);
      [...sceneNodes].sort((a,b)=>(a.gx+a.gy+a.w+a.d)-(b.gx+b.gy+b.w+b.d)).forEach(n=>ng.appendChild(drawNode(n)));
      const lg=el('g'); world.appendChild(lg); sceneNodes.forEach(n=>lg.appendChild(drawLabel(n)));
      world.appendChild(el('g',{id:'pkts'})); drawPackets(); renderRail();
    }
    function drawLabel(n){
      const g=el('g',{style:'pointer-events:none'});
      const b=P(n.gx+n.w, n.gy+n.d, 0); const txt=(n.short||n.name).toUpperCase(); const w=txt.length*6.6+10; const y=b[1]+9;
      const dim=n.ghost&&!n.inside;
      g.appendChild(el('rect',{x:b[0]-w/2,y:y,width:w,height:14,fill:S.selected===n.id?'var(--hi-bg)':'var(--paper)',stroke:dim?'var(--ghost)':'var(--ink)','stroke-width':.9,'stroke-dasharray':dim?'3 2':'none'}));
      const t=el('text',{x:b[0],y:y+10.5,'text-anchor':'middle','font-size':'9','font-family':'var(--mono)','letter-spacing':'.06em',fill:S.selected===n.id?'var(--hi-fg)':(dim?'var(--ink-2)':'var(--ink)'),'font-weight':'500'}); t.textContent=txt; g.appendChild(t);
      return g;
    }
    function drawNode(n){
      const g=el('g',{class:'node',style:'cursor:pointer','data-id':n.id});
      const {gx,gy,w,d,h}=n; const sel=S.selected===n.id, hov=S.hover===n.id, fresh=!n.inside&&isNew(n.id);
      const sw=sel?2:1.2, dash=n.ghost?'4 3':null, face=n.ghost?'none':'var(--face)';
      const face3=(p,fill,hatch,extra={})=>{const poly=el('polygon',{points:pts(p),fill:fill,stroke:'var(--ink)','stroke-width':sw,'stroke-linejoin':'round',...extra});if(dash)poly.setAttribute('stroke-dasharray',dash);g.appendChild(poly);if(hatch&&!n.ghost){g.appendChild(el('polygon',{points:pts(p),fill:'url(#'+hatch+')',style:'color:var(--ink)',stroke:'none'}));}};
      const box=(z0,z1,hatchTop)=>{ face3([P(gx,gy+d,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],face,'hatch'); face3([P(gx+w,gy,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx+w,gy,z1)],face,'hatch'); face3([P(gx,gy,z1),P(gx+w,gy,z1),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],face,hatchTop||null); };
      const kind=n.kind||'box';
      if(kind==='store'){ const L=3, gap=3, lh=(h-gap*(L-1))/L; for(let i=0;i<L;i++){ const z0=i*(lh+gap); box(z0,z0+lh,null);} }
      else if(kind==='cards'){ const L=5, lh=h/L; for(let i=0;i<L;i++) box(i*lh,(i+1)*lh,null); }
      else if(kind==='slab'){ box(0,h,'hatchLight'); }
      else if(kind==='screen'){ box(0,h,null); const inset=.3; if(!n.ghost){ const scr=[P(gx+inset,gy+inset,h),P(gx+w-inset,gy+inset,h),P(gx+w-inset,gy+d-inset,h),P(gx+inset,gy+d-inset,h)]; g.appendChild(el('polygon',{points:pts(scr),fill:'var(--paper)',stroke:'var(--ink)','stroke-width':.9})); for(let i=1;i<=3;i++){const a=P(gx+inset+.2,gy+inset+i*.4,h),b=P(gx+w-inset-.4-(i===3?.5:0),gy+inset+i*.4,h);g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--ink)','stroke-width':.8,opacity:.7}));} } }
      else if(kind==='gate'){ box(0,h,null); if(!n.ghost){ const z0=h*.55,z1=h*.75; const band=[[P(gx,gy+d,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],[P(gx+w,gy,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx+w,gy,z1)]]; band.forEach(p=>g.appendChild(el('polygon',{points:pts(p),fill:'var(--ink)',opacity:.85,stroke:'none'}))); } }
      else if(kind==='tall'){ box(0,h,null); if(!n.ghost){ // roof ridge line on top to read as "the brain"
          const c=P(gx+w/2,gy+d/2,h); const a=P(gx,gy+d,h),b=P(gx+w,gy,h); g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--ink)','stroke-width':.8,opacity:.5})); } }
      else if(kind==='job'){ box(0,h,'hatchLight'); }
      else { box(0,h,null); }
      const top=[P(gx,gy,h),P(gx+w,gy,h),P(gx+w,gy+d,h),P(gx,gy+d,h)];
      if(sel||hov){ g.appendChild(el('polygon',{points:pts(top),fill:sel?'var(--ink)':'none',opacity:sel?.12:1,stroke:'var(--ink)','stroke-width':sel?2.5:1.8})); }
      if(fresh&&!sel){ g.appendChild(el('polygon',{class:'halo',points:pts([P(gx-.35,gy-.35,0),P(gx+w+.35,gy-.35,0),P(gx+w+.35,gy+d+.35,0),P(gx-.35,gy+d+.35,0)]),fill:'none',stroke:'var(--ink)','stroke-width':1.4,'stroke-dasharray':'4 3'})); }
      const c=P(gx+w/2,gy+d/2,h); const chipW=16;
      g.appendChild(el('rect',{x:c[0]-chipW/2,y:c[1]-8,width:chipW,height:14,fill:sel?'var(--hi-bg)':'var(--paper)',stroke:'var(--ink)','stroke-width':1}));
      const t=el('text',{x:c[0],y:c[1]+3,'text-anchor':'middle','font-size':'9','font-family':'var(--mono)',fill:sel?'var(--hi-fg)':'var(--ink)','font-weight':'600'}); t.textContent=n.code; g.appendChild(t);
      g.addEventListener('mouseenter',e=>{S.hover=n.id;showTip(e,n);renderPanel();render();});
      g.addEventListener('mousemove',e=>moveTip(e));
      g.addEventListener('mouseleave',()=>{S.hover=null;hideTip();renderPanel();render();});
      g.addEventListener('click',e=>{e.stopPropagation();select(n.id);});
      g.addEventListener('dblclick',e=>{e.stopPropagation();if(!n.inside)goInside(n.id);});
      return g;
    }

    /* ---------------- PACKETS ---------------- */
    function initPackets(){ S.packets=[]; const flows=[...new Set(sceneHops.map(h=>h.flow))]; flows.forEach(f=>S.packets.push({flow:f,hop:0,t:0,speed:.5,pause:0})); S.selPacket=null; }
    function hopsOf(flow){ return sceneHops.filter(h=>h.flow===flow); }
    function drawPackets(){
      const pg=world.querySelector('#pkts'); if(!pg)return; pg.innerHTML='';
      S.packets.forEach((p,i)=>{ const hs=hopsOf(p.flow); const h=hs[p.hop]; if(!h||!h.path)return; const [x,y]=pointAt(h.path,p.t);
        const isSel=S.selPacket===i; const g=el('g',{class:'pkt',style:'cursor:pointer'});
        if(isSel) g.appendChild(el('circle',{cx:x,cy:y,r:11,fill:'none',stroke:'var(--ink)','stroke-width':1.2,'stroke-dasharray':'2 2'}));
        g.appendChild(el('circle',{cx:x,cy:y,r:5.5,fill:'var(--ink)',stroke:'var(--paper)','stroke-width':1.6}));
        if(isSel||S.hoverPacket===i||S.ch<CH.length-1){ const lbl=el('text',{x:x+10,y:y-8,'font-size':'10','font-family':'var(--mono)',fill:'var(--ink)','font-weight':'500'}); lbl.textContent=h.label; g.appendChild(el('rect',{x:x+7,y:y-19,width:h.label.length*6.4+6,height:14,fill:'var(--paper)',stroke:'var(--ink)','stroke-width':.8})); g.appendChild(lbl); }
        g.addEventListener('click',e=>{e.stopPropagation();S.hover=null;hideTip();S.selPacket=i;S.playing=false;syncFlowBtn();renderPanel();drawPackets();});
        g.addEventListener('mouseenter',()=>{S.hover=null;hideTip();S.hoverPacket=i;drawPackets();});
        g.addEventListener('mouseleave',()=>{S.hoverPacket=null;drawPackets();});
        pg.appendChild(g);
      });
    }
    let last=0;
    function tick(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; tweenTick(); if(S.playing){ S.packets.forEach(p=>advance(p,dt)); drawPackets(); if(S.selPacket!=null) renderPanel(); } requestAnimationFrame(tick); }
    function advance(p,dt){ const hs=hopsOf(p.flow); if(!hs.length)return; if(p.pause>0){p.pause-=dt;return;} const h=hs[p.hop]; if(!h||!h.path){p.hop=(p.hop+1)%hs.length;return;} p.t+=dt*p.speed*(320/Math.max(120,h.path.len)); if(p.t>=1){p.t=0;p.hop=(p.hop+1)%hs.length;p.pause=(p.hop===0?1.2:.35);} }
    function stepOnce(){ S.playing=false; syncFlowBtn(); let i=S.selPacket??0; const p=S.packets[i]; if(!p)return; const hs=hopsOf(p.flow); p.hop=(p.hop+1)%hs.length; p.t=.5; p.pause=0; S.selPacket=i; drawPackets(); renderPanel(); }
    function syncFlowBtn(){ document.getElementById('btnFlow').textContent = S.playing?'‖ Pause':'▸ Play'; }
    requestAnimationFrame(tick);

    /* ---------------- PANEL ---------------- */
    function nodeChip(id){ const n=byId[id]; return `<button type="button" class="chip${n.ghost?' ghost':''}" onclick="select('${id}')">${esc(n.code)} · ${esc(n.name)}</button>`; }
    function renderPanel(){
      document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
      if(S.selPacket!=null && S.packets[S.selPacket]){ const p=S.packets[S.selPacket]; const hs=hopsOf(p.flow); const h=hs[p.hop];
        const A=sceneNodes.find(n=>n.id===h.from), B=sceneNodes.find(n=>n.id===h.to); const flowName=p.flow==='ch'?CH[S.ch].title:p.flow==='inside'?'inside '+byId[S.inside].name:(FLOWS.find(f=>f.id===p.flow)||{}).name;
        body.innerHTML=`<div class="eyebrow">Data packet · ${esc(flowName)} · hop ${p.hop+1} of ${hs.length}</div><h1 class="t">${esc(h.label)}</h1>
        <div class="pk"><div class="lbl">Route</div><div class="route">${esc(A.code)} ${esc(A.name)} &nbsp;→&nbsp; ${esc(B.code)} ${esc(B.name)}</div><div class="lbl">Payload (representative)</div><pre>${esc(JSON.stringify(h.payload,null,2))}</pre></div>
        <p>Payload shapes are what the design implies, not measured traffic.</p>
        <div class="actions"><button type="button" class="ctl" onclick="stepOnce()">Trace one step</button><button type="button" class="ctl" onclick="S.selPacket=null;S.playing=true;syncFlowBtn();renderPanel();drawPackets()">Release & play</button><button type="button" class="ctl" onclick="select('${esc(B.id)}')">Open ${esc(B.code)}</button></div>`; return; }
      const id=S.selected??S.hover; const n=id?sceneNodes.find(x=>x.id===id):null;
      if(!n){ renderChapterPanel(); return; }
      if(n.inside){ const parent=byId[S.inside]; const i=+n.id.slice(1);
        body.innerHTML=`<div class="eyebrow">Inside ${esc(parent.code)} · ${esc(parent.name)} · step ${i+1} of ${parent.steps.length}</div><h1 class="t">${esc(n.name)}</h1><p class="lede">${esc(n.desc)}</p>
        <h3 class="sec">All steps</h3>${parent.steps.map((s,j)=>`<div class="step ${j===i?'cur':''}"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}
        <div class="actions"><button type="button" class="ctl" onclick="comeOut()">← Come back out</button></div>`; return; }
      const status = n.ghost?'<span class="chip ghost static">Not switched on</span>':`<span class="chip static">${esc(groupById[n.group]||n.group)}</span>`;
      const pinned=S.selected===n.id;
      let content='';
      if(S.tab==='what') content=`<p class="lede">${n.one}</p><details${pinned?' open':''}><summary>Read more</summary><p>${n.what}</p></details>${n.steps?`<details><summary>Steps in execution</summary>${n.steps.map((s,j)=>`<div class="step"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}</details>`:''}`;
      else if(S.tab==='how') content=`<p class="lede">${n.one}</p><p>${n.how}</p>`;
      else content=`<p class="lede">${n.one}</p>`+(n.cond&&n.cond.length?qHtml(n.cond):`<p>Nothing open here right now.</p>`);
      body.innerHTML=`<div class="eyebrow">${esc(n.code)} · ${pinned?'pinned':'hovering'}${isNew(n.id)?' · new in this chapter':''}</div><h1 class="t">${esc(n.name)}</h1><div class="sub">${status}</div>${content}
      ${pinned?`<div class="actions">${n.steps?`<button type="button" class="ctl" onclick="goInside('${n.id}')">→ Go inside</button>`:''}<button type="button" class="ctl" onclick="select(null)">Back to chapter</button></div>`:''}`;
    }
    function renderChapterPanel(){
      const c=CH[S.ch]; const last=S.ch===CH.length-1;
      if(S.tab==='how'){ body.innerHTML=HOW_HTML; return; }
      if(S.tab==='cond'){ body.innerHTML=`<div class="eyebrow">${esc(TITLE)}</div><h1 class="t">Open questions</h1><div class="sub">${last?'everything unresolved, by structure':'for the structures revealed so far'}</div>`+NODES.filter(n=>revealedIds().includes(n.id)&&n.cond&&n.cond.length).map(n=>`<h3 class="sec">${n.code} · ${esc(n.name)}${n.ghost?' <span class="chip ghost static">later</span>':''}</h3>${qHtml(n.cond)}`).join(''); return; }
      const chips = last ? '' : `<h3 class="sec">New in this chapter</h3><div>${c.reveal.map(nodeChip).join('')}</div>`;
      const nav=`<div class="actions"><button type="button" class="ctl" onclick="prevCh()" ${S.ch===0?'disabled':''}>◂ Back</button><button type="button" class="ctl primary" onclick="nextCh()" ${last?'disabled':''}>${S.ch===CH.length-2?'Show the whole system ▸':'Next ▸'}</button></div>`;
      body.innerHTML=`<div class="eyebrow">Chapter ${S.ch+1} of ${CH.length}</div><h1 class="t">${esc(c.title)}</h1><p class="lede">${c.lede}</p>${c.story}${chips}${nav}
      ${last?`<h3 class="sec">Decisions locked</h3><ul>${DECISIONS_HTML}</ul>`:''}`;
    }
    document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.selPacket=null;renderPanel();drawPackets();}));

    /* ---------------- STATS ---------------- */
    function renderStats(){ const el=document.getElementById('stats'); const open=NODES.reduce((a,n)=>a+qOpen(n),0), routed=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.to).length,0), res=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.r).length,0);
      const dyn={chapter:`${S.ch+1} / ${CH.length}`, shown:`${revealedIds().length} / ${NODES.length}`, questions:`${open} open · ${routed} routed · ${res} resolved`};
      const all=[...(STATS||[]), {k:'Chapter',v:dyn.chapter},{k:'Structures shown',v:dyn.shown},{k:'Open questions',v:dyn.questions,grow:true}];
      el.innerHTML=all.map(s=>`<div class="stat${s.grow?' grow':''}"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join(''); }

    /* ---------------- INDEX + RAIL ---------------- */
    function renderIndex(){
      const ix=document.getElementById('index'); ix.innerHTML=''; const rev=new Set(revealedIds());
      GROUPS.forEach(g=>{ const h=document.createElement('h4'); h.textContent=g.title; ix.appendChild(h);
        NODES.filter(n=>n.group===g.id).forEach(n=>{ const b=document.createElement('button'); const shown=rev.has(n.id);
          b.className='ix'+(n.ghost&&shown?' ghost':'')+(!shown?' later':'')+(S.selected===n.id?' on':'')+(isNew(n.id)?' new':''); b.dataset.id=n.id;
          b.innerHTML=`<span class="code">${n.code}</span><span class="nm">${esc(n.name)}</span><span class="n" title="${shown?'open questions':'revealed in chapter'}">${shown?qOpen(n):'ch '+(revealChapterOf(n.id)+1)}</span>`;
          b.addEventListener('click',()=>{ if(!shown){ gotoCh(revealChapterOf(n.id)); select(n.id); return; } if(S.view!=='world')comeOut(); select(n.id); focusNode(n); });
          b.addEventListener('mouseenter',()=>{ if(S.view==='world'&&shown){S.hover=n.id;renderPanel();render();} });
          b.addEventListener('mouseleave',()=>{ if(S.view==='world'){S.hover=null;renderPanel();render();} });
          ix.appendChild(b); }); });
      renderStats();
    }
    function renderRail(){ const r=document.getElementById('rail'); if(S.view!=='world'){ r.innerHTML=`<span class="title">THE SYSTEM &nbsp;›&nbsp; <b>${esc(byId[S.inside].code)} ${esc(byId[S.inside].name)}</b> &nbsp;·&nbsp; steps in execution</span>`; document.getElementById('flowSel').style.display='none'; return; }
      r.innerHTML=CH.map((c,i)=>`<button type="button" class="ch ${i===S.ch?'on':i<S.ch?'done':''} ${i>S.maxCh+1?'locked':''}" title="${esc(c.title)}" onclick="gotoCh(${i})">${i+1}</button>`).join('')+`<span class="title">chapter ${S.ch+1} · <b>${esc(CH[S.ch].title)}</b></span>`;
      const fs=document.getElementById('flowSel'); fs.style.display = S.ch===CH.length-1?'flex':'none';
      if(!fs.dataset.built){ fs.innerHTML=[...FLOWS.map(f=>`<button type="button" data-f="${f.id}">${f.name}</button>`),'<button type="button" data-f="both">All flows</button>'].join(''); fs.dataset.built='1'; fs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.hover=null;hideTip();S.flowSel=b.dataset.f;buildWorldScene();initPackets();render();})); }
      fs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flowSel));
      document.getElementById('btnBack').disabled=S.ch===0; document.getElementById('btnNext').disabled=S.ch===CH.length-1;
    }

    /* ---------------- NAV ---------------- */
    function select(id){ S.selected=id; S.hover=null; hideTip(); S.selPacket=null; renderIndex(); renderPanel(); render(); }
    function gotoCh(i){ i=Math.max(0,Math.min(CH.length-1,i)); if(S.view!=='world'){S.view='world';S.inside=null;} S.ch=i; S.maxCh=Math.max(S.maxCh,i); S.selected=null; S.hover=null; hideTip(); S.tab='what'; buildWorldScene(); initPackets(); S.playing=true; syncFlowBtn(); renderIndex(); render(); renderPanel(); fitView(true); }
    function nextCh(){ gotoCh(S.ch+1); } function prevCh(){ gotoCh(S.ch-1); }
    function goInside(id){ const n=byId[id]; if(!n||!n.steps)return; S.view='inside'; S.inside=id; S.selected='s0'; S.hover=null; hideTip(); buildInsideScene(n); initPackets(); fitView(true); renderIndex(); render(); renderPanel(); }
    function comeOut(){ const was=S.inside; S.view='world'; S.inside=null; S.hover=null; hideTip(); buildWorldScene(); initPackets(); S.selected=was; fitView(true); renderIndex(); render(); renderPanel(); }
    function orderList(){ return S.view==='world'?sceneNodes.map(n=>n.id):sceneNodes.map(n=>n.id); }
    document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const L=orderList(); let i=L.indexOf(S.selected);
      if(e.key==='ArrowDown'){e.preventDefault();select(L[Math.min(L.length-1,i+1)]);}
      else if(e.key==='ArrowUp'){e.preventDefault();select(L[Math.max(0,i-1)]);}
      else if(e.key==='ArrowRight'){e.preventDefault(); if(S.view==='world'&&S.selected)goInside(S.selected);}
      else if(e.key==='ArrowLeft'){e.preventDefault(); if(S.view==='inside')comeOut(); else select(null);}
      else if(e.key==='Enter'||e.key===']'){e.preventDefault(); if(S.view==='world')nextCh();}
      else if(e.key==='['){e.preventDefault(); if(S.view==='world')prevCh();}
      else if(e.key===' '){e.preventDefault();toggleFlow();}
      else if(e.key==='Escape'){select(null);} });

    /* ---------------- VIEW / PAN / ZOOM ---------------- */
    let tween=null;
    function applyView(){ world.setAttribute('transform',`translate(${S.tx},${S.ty}) scale(${S.k})`); }
    function tweenTick(){ if(!tween)return; const now=performance.now(); let u=Math.min(1,(now-tween.t0)/tween.dur); u=1-Math.pow(1-u,3); S.tx=tween.a.tx+(tween.b.tx-tween.a.tx)*u; S.ty=tween.a.ty+(tween.b.ty-tween.a.ty)*u; S.k=tween.a.k+(tween.b.k-tween.a.k)*u; applyView(); if(u>=1)tween=null; }
    function setView(tx,ty,k,anim){ tween=null; if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ tween={a:{tx:S.tx,ty:S.ty,k:S.k},b:{tx,ty,k},t0:performance.now(),dur:520}; } else { S.tx=tx;S.ty=ty;S.k=k;applyView(); } }
    function bbox(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; sceneNodes.forEach(n=>{[P(n.gx,n.gy,n.h),P(n.gx+n.w,n.gy,n.h),P(n.gx+n.w,n.gy+n.d,-24),P(n.gx,n.gy+n.d,0),P(n.gx,n.gy,0)].forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});}); return {x0,y0,x1,y1}; }
    function fitView(anim){ const r=svg.getBoundingClientRect(); if(!sceneNodes.length)return; const b=bbox(); const pad=40; const k=Math.min((r.width-pad*2)/Math.max(1,b.x1-b.x0),(r.height-pad*2)/Math.max(1,b.y1-b.y0)); if(r.width<80||r.height<80||!isFinite(k)||k<=0)return; const kk=Math.max(.2,Math.min(k,1.5)); setView(r.width/2-((b.x0+b.x1)/2)*kk, r.height/2-((b.y0+b.y1)/2)*kk+8, kk, anim); }
    function focusNode(n){ const r=svg.getBoundingClientRect(); const c=P(n.gx+n.w/2,n.gy+n.d/2,n.h/2); setView(r.width/2-c[0]*S.k, r.height/2-c[1]*S.k, S.k, true); }
    function zoomAt(f,cx,cy){ tween=null; const nk=Math.max(.35,Math.min(3,S.k*f)); S.tx=cx-(cx-S.tx)*(nk/S.k); S.ty=cy-(cy-S.ty)*(nk/S.k); S.k=nk; applyView(); }
    svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top);},{passive:false});
    let drag=null; svg.addEventListener('pointerdown',e=>{ if(e.button!==0)return; tween=null; drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moved:false}; svg.setPointerCapture(e.pointerId); });
    svg.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.hypot(dx,dy)>3){drag.moved=true;svg.classList.add('dragging');} S.tx=drag.tx+dx; S.ty=drag.ty+dy; applyView(); });
    svg.addEventListener('pointerup',e=>{ if(drag&&!drag.moved){ select(null); } drag=null; svg.classList.remove('dragging'); });
    document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
    document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
    window.addEventListener('resize',()=>fitView(false));

    /* ---------------- TIP ---------------- */
    function showTip(e,n){ tip.style.display='block'; tip.textContent=n.inside?n.desc:(n.ghost?'Later · ':'')+n.name+' — '+(n.one||'').replace(/<[^>]+>/g,''); moveTip(e); }
    function moveTip(e){ const r=svg.getBoundingClientRect(); let x=e.clientX-r.left+14,y=e.clientY-r.top+14; if(x+290>r.width)x-=300; if(y+60>r.height)y-=70; tip.style.left=x+'px'; tip.style.top=y+'px'; }
    function hideTip(){ tip.style.display='none'; }

    /* ---------------- CONTROLS ---------------- */
    function toggleFlow(){ S.playing=!S.playing; if(S.playing)S.selPacket=null; syncFlowBtn(); renderPanel(); drawPackets(); }
    document.getElementById('btnFlow').onclick=toggleFlow;
    document.getElementById('btnStep').onclick=stepOnce;
    document.getElementById('btnReset').onclick=()=>{ select(null); fitView(true); };
    document.getElementById('btnNext').onclick=nextCh; document.getElementById('btnBack').onclick=prevCh;
    function activeTheme(){ const explicit=document.documentElement.dataset.theme; if(explicit)return explicit; return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
    function syncThemeButton(){ document.getElementById('btnTheme').textContent=activeTheme()==='dark'?'Light theme':'Dark theme'; }
    document.getElementById('btnTheme').onclick=()=>{ document.documentElement.dataset.theme=activeTheme()==='dark'?'light':'dark'; syncThemeButton(); };
    syncThemeButton();

    /* ---------------- BOOT ---------------- */
    gotoCh(0);
    </script>
